    <!-- Supporting pillars / bar chart silhouette underneath -->
    <rect x="25" y="195" width="35" height="45" rx="6" fill="#ffffff" stroke="none"/>
    <rect x="85" y="145" width="35" height="95" rx="6" fill="#ffffff" stroke="none"/>
    <rect x="145" y="170" width="35" height="70" rx="6" fill="#ffffff" stroke="none"/>
