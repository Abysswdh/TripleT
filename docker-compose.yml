version: "3.9"

services:

  # Local PostgreSQL (optional — use Supabase in production)
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: doable
      POSTGRES_PASSWORD: doable_dev_password
      POSTGRES_DB: doable
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
